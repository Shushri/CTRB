version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ctrb_db
    environment:
      POSTGRES_USER: ctrb_admin
      POSTGRES_PASSWORD: ctrb_password
      POSTGRES_DB: ctrb_tims
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  minio:
    image: minio/minio
    container_name: ctrb_s3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pgdata:
  minio_data:
