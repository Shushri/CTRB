version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ctrb_db
    environment:
      POSTGRES_USER: ctrb_admin
      POSTGRES_PASSWORD: ctrb_password
      POSTGRES_DB: ctrb_tims
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  minio:
    image: minio/minio
    container_name: ctrb_s3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin password123;
      /usr/bin/mc mb --ignore-existing myminio/ctrb-bucket;
      exit 0;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ctrb_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_USER=ctrb_admin
      - DB_PASSWORD=ctrb_password
      - DB_NAME=ctrb_tims
      - DB_HOST=db
      - DB_PORT=5432
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - AWS_ENDPOINT=http://minio:9000
      - AWS_BUCKET_NAME=ctrb-bucket
    depends_on:
      - db
      - minio

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ctrb_web
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  minio_data:

